<!DOCTYPE html>
<html>
  <head>
    <title>Cat face game</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <h1>Match all cat-faces!</h1>
  <div id="app"></div>
  <div id="ed"></div>
  <button onclick="checkFaces()">klikk</button>
</body>
<script>
  const app = document.getElementById("app");
  const catFaces = {
    joy: "😹",
    angry: "😾",
    sad: "😿",
    happy: "😸",
    smug: "😼",			
    love: "😻",
    shock: "🙀"
  };
  Array.from({ length: 2 }, (_,i) => {
    const divEl = document.createElement("div");
    const spanEl = document.createElement("div");
    const faces = Object.values(catFaces);
    
    divEl.style.animationDelay = `calc(${-0.6 * i}s)`;
    spanEl.innerHTML = faces[Math.floor(Math.random() * faces.length)];
    spanEl.setAttribute("class", "catFace");
    divEl.addEventListener("click", function() {
      spanEl.innerHTML =
        faces[Math.floor(Math.random() * faces.length)];
    });
    divEl.addEventListener("click", checkFaces);
    divEl.append(spanEl);
    return { div: divEl };
  }).map(
    divObj => app.append(divObj.div)
  );
  
  function checkFaces(){
    if (Object.values(document.getElementsByClassName("catFace")).every((face,_,arr) => face.innerHTML === arr[0].innerHTML))
      document.getElementById("ed").innerHTML = "Alle ansikter matcher!";
  }
</script>
</html>
